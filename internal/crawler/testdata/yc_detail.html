<div id="WaasPage" data-page="{&quot;component&quot;:&quot;WaasShowJobPage&quot;,&quot;props&quot;:{&quot;job&quot;:{&quot;id&quot;:93346,&quot;title&quot;:&quot;Senior Software Engineer (Hybrid/San Francisco area)&quot;,&quot;url&quot;:&quot;/companies/pine-park-health/jobs/wx8rhlj-senior-software-engineer-hybrid-san-francisco-area&quot;,&quot;applyUrl&quot;:&quot;https://account.ycombinator.com/authenticate?continue=https%3A%2F%2Fwww.workatastartup.com%2Fapplication%3Fsignup_job_id%3D93346&amp;defaults%5BsignUpActive%5D=true&amp;defaults%5Bwaas_company%5D=1965&quot;,&quot;location&quot;:&quot;Berkeley, CA, US / San Francisco, CA, US / Remote (Berkeley, CA, US; San Francisco, CA, US)&quot;,&quot;askUs&quot;:true,&quot;type&quot;:&quot;Full-time&quot;,&quot;role&quot;:&quot;eng&quot;,&quot;roleSpecificType&quot;:&quot;Full stack&quot;,&quot;prettyRole&quot;:&quot;Engineering&quot;,&quot;salaryRange&quot;:&quot;$190K - $215K&quot;,&quot;equityRange&quot;:&quot;&quot;,&quot;minExperience&quot;:&quot;6+ years&quot;,&quot;minSchoolYear&quot;:null,&quot;visa&quot;:&quot;US citizen/visa only&quot;,&quot;skills&quot;:[&quot;Google Cloud&quot;,&quot;Node.js&quot;,&quot;PostgreSQL&quot;,&quot;React&quot;,&quot;TypeScript&quot;],&quot;isIncomplete&quot;:false,&quot;companyUrl&quot;:&quot;/companies/pine-park-health&quot;,&quot;companyLogoUrl&quot;:&quot;https://bookface-images.s3.amazonaws.com/small_logos/3facf7f7379345c5f8e16d3059db45980ba0aa68.png&quot;,&quot;companyName&quot;:&quot;Pine Park Health&quot;,&quot;companyBatchName&quot;:&quot;S18&quot;,&quot;companyOneLiner&quot;:&quot;We provide primary care in senior living communities.&quot;,&quot;createdAt&quot;:&quot;7 months&quot;,&quot;lastActive&quot;:&quot;about 22 hours&quot;,&quot;description&quot;:&quot;### **About the Role**\n\nPine Park Health brings doctors and nurses to seniors where they live. We&amp;#x27;re backed by YC, First Round Capital, Gradient Ventures (Google), Averin Canvas, Foundation, Liquid 2, Box Group, and others, and we&amp;#x27;re based in the Bay Area.\n\nPine Park has three stacked parts:\n\n* First, it is a service business. We hire doctors and send them each week to see frail seniors in their apartments, so they don’t have to travel to clinics or hospitals for primary care.\n* Second, because house calls are expensive, we build software to make them cheap enough to scale. The software reads patient data, triages issues, handles faxes, schedules visits, orders labs, manages referrals, checks in on patients, and runs follow-up. \n* Third, we have a business model that makes the first two work. We partner with Medicare and Medicare Advantage so they give us a fixed budget per patient per year based on expected medical spending. If we keep patients healthier and their total spending comes in below that budget, we keep the difference.\n\n \n\nThat allows us to run a primary care practice that makes money by pulling cost out of the most expensive parts of the system, especially hospitals.\n\n \\\n**What This Looks Like Day-to-Day**\n\nThe Senior Software Engineer role at Pine Park Health is 60% product and 40% engineering. So if you’re looking for a startup where you just write code, Pine Park Health is not the right fit.\n\n* You’ll receive a key business problem to solve, with spe&quot;,&quot;interview_process&quot;:&quot;**Interview Process**\n\nWe believe in a thorough but respectful process. Here&amp;#x27;s what to expect:\n\n**1. Application + Cover Letter (Required)**\\\nSend us a cover letter about a system you built that you&amp;#x27;re proud of — not because it was technically clever, but because it held up over time, solved the right problem, and you made good tradeoff decisions along the way. Tell us how you&amp;#x27;d approach it differently now. We care about your judgment, not your resume.\n\n**2. Recruiter Screen (30 minutes)**\\\nConversation with our recruiting team to discuss your background, what you&amp;#x27;re looking for, and answer initial questions about the role.\n\n**3. Hiring Manager Screen (45 minutes)**\\\nTechnical conversation with Shane, our \\[title\\], to dive into your experience and discuss the problems we&amp;#x27;re solving.\n\n**4. Senior Engineer Interview (45-60 minutes)**\\\nMeet with one of our Senior Engineers to explore technical depth, discuss your development workflow, and talk through your approach to product engineering.\n\n**5. On-Site Simulation (2-3 hours)**\\\nVisit our Berkeley office for a scenario-based interview. You&amp;#x27;ll work through a real product problem with the team — think through the user need, design a solution, and discuss trade-offs. This is conversational, not a whiteboard coding exercise.\n\n**6. CEO Conversation (30-45 minutes)**\\\nFinal conversation with George, our CEO, to discuss vision, culture fit, and answer any remaining questions you have about Pine Park Health.\n\n**Timeline:** The entire process typically takes 3-5 weeks from application to offer.&quot;},&quot;company&quot;:{&quot;name&quot;:&quot;Pine Park Health&quot;}}}"></div>
